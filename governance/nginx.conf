# Read-only static server. Authentication is not done here: Traefik's
# forwardAuth (homelab-auth) gates the whole host before a request reaches this
# container, and the container has no published port, so there is no other way in.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Inline style/script because each page is one self-contained file; fonts
    # are the only external fetch.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # A republished page must show up on the next load. Status is useless if a
    # browser cache turns it into the thing it exists to prevent: old and
    # looking current.
    add_header Cache-Control "no-cache" always;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    # The status page is not one of the Mac-published pages: the homelab-jobs
    # container on the NAS rebuilds it after every live run, into its own
    # directory mounted here, so it refreshes with the Mac shut.
    location = /       { root /usr/share/nginx/live; try_files /index.html =404; }
    location /         { try_files $uri $uri.html =404; }
  }
}
